<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-labelledby="t d">
<title id="t">BahAlert</title>
<desc id="d">Community flood monitor. ESP32 sensors feed a live map that routes people to safety. Built with React, Mapbox, Firebase, ESP32.</desc>
<defs>
  <linearGradient id="ca" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
  <radialGradient id="cg1"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.18"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  <radialGradient id="cg2"><stop offset="0" stop-color="#0891b2" stop-opacity="0.18"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
  <pattern id="cd" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#d0d7de"/></pattern>
</defs>
<style>
  .label { font: 600 11px "JetBrains Mono", "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; letter-spacing: .14em; fill: #59636e; }
  .title { font: 700 28px "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; letter-spacing: -.015em; fill: #1f2328; }
  .desc { font: 400 15px "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; fill: #59636e; }
  .chip { font: 500 12px "JetBrains Mono", "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; fill: #1f2328; }
  .pill { font: 700 11px "JetBrains Mono", "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; letter-spacing: .08em; fill: #3fb950; }
  .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 404.8px 37px; }
  @keyframes pulse { 50% { opacity: .25; transform: scale(1.6); } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
</style>
<rect x=".5" y=".5" width="479" height="219" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<circle cx="470" cy="10" r="170" fill="url(#cg1)"/>
<rect x="28" y="0" width="56" height="3" rx="1.5" fill="url(#ca)"/>
<text class="label" x="28" y="42">IOT · WEB</text>
<rect x="390.8" y="25" width="61.2" height="24" rx="12" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".4"/>
<circle class="pulse" cx="404.8" cy="37" r="3.5" fill="#3fb950"/>
<text class="pill" x="414.8" y="41">LIVE</text>
<text class="title" x="28" y="90">BahAlert <tspan fill="url(#ca)" font-size="22">↗</tspan></text>
<text class="desc" x="28" y="122">Community flood monitor. ESP32 sensors feed</text>
<text class="desc" x="28" y="144">a live map that routes people to safety.</text>
<rect x="28" y="168" width="59" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/><text class="chip" x="57.5" y="185.5" text-anchor="middle">React</text><rect x="95" y="168" width="66.4" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/><text class="chip" x="128.2" y="185.5" text-anchor="middle">Mapbox</text><rect x="169.4" y="168" width="81.2" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/><text class="chip" x="210" y="185.5" text-anchor="middle">Firebase</text><rect x="258.6" y="168" width="59" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/><text class="chip" x="288.1" y="185.5" text-anchor="middle">ESP32</text>
</svg>
