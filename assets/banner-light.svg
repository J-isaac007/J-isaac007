<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-labelledby="t d">
<title id="t">John Isaac Escal</title>
<desc id="d">I build desktop apps, flood alert systems, lunar landing sims and controller remappers.</desc>
<defs>
  <linearGradient id="ba" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
  <radialGradient id="bg1"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.18"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  <radialGradient id="bg2"><stop offset="0" stop-color="#0891b2" stop-opacity="0.18"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
  <pattern id="bd" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#d0d7de"/></pattern>
</defs>
<style>
  .label { font: 600 13px "JetBrains Mono", "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; letter-spacing: .18em; fill: #59636e; }
  .name { font: 700 56px "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; letter-spacing: -.02em; fill: #1f2328; }
  .lead, .phrase { font: 600 26px "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; letter-spacing: -.01em; }
  .lead { fill: #59636e; }
  .phrase { opacity: 0; animation: swap 12s ease-in-out infinite; }
  .tl { font: 500 13px "JetBrains Mono", "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; fill: #1f2328; opacity: 0; animation: type .3s ease-out forwards; }
  .caret { fill: #0891b2; animation: blink 1s steps(1, end) infinite; }
  .drift1 { animation: drift 14s ease-in-out infinite alternate; }
  .drift2 { animation: drift 18s ease-in-out infinite alternate-reverse; }
  @keyframes swap {
    0% { opacity: 0; transform: translateY(10px); }
    4%, 21% { opacity: 1; transform: none; }
    25%, 100% { opacity: 0; transform: translateY(-10px); }
  }
  @keyframes type { to { opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes drift { to { transform: translate(-120px, 40px); } }
  /* Phones: drop the terminal and grow the text. */
  @media (max-width: 600px) {
    .term { display: none; }
    .label { font-size: 24px; transform: translateY(-22px); }
    .name { font-size: 92px; }
    .line { transform: translateY(36px); }
    .lead, .phrase { font-size: 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .phrase, .tl, .caret, .drift1, .drift2 { animation: none; }
    .tl { opacity: 1; }
    .p0 { opacity: 1; }
  }
</style>
<rect x=".5" y=".5" width="999" height="259" rx="20" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x=".5" y=".5" width="999" height="259" rx="20" fill="url(#bd)" opacity=".7"/>
<g class="drift1"><circle cx="300" cy="40" r="260" fill="url(#bg1)"/></g>
<g class="drift2"><circle cx="820" cy="250" r="240" fill="url(#bg2)"/></g>
<text class="label" x="58" y="92">HI, I'M</text>
<text class="name" x="54" y="150">John Isaac Escal</text>
<g class="line">
  <text class="lead" x="56" y="196">I build</text>
  <text class="phrase p0" style="animation-delay:0s" x="56" y="196"><tspan fill-opacity="0">I build </tspan><tspan fill="url(#ba)">desktop apps</tspan></text><text class="phrase" style="animation-delay:3s" x="56" y="196"><tspan fill-opacity="0">I build </tspan><tspan fill="url(#ba)">flood alert systems</tspan></text><text class="phrase" style="animation-delay:6s" x="56" y="196"><tspan fill-opacity="0">I build </tspan><tspan fill="url(#ba)">lunar landing sims</tspan></text><text class="phrase" style="animation-delay:9s" x="56" y="196"><tspan fill-opacity="0">I build </tspan><tspan fill="url(#ba)">controller remappers</tspan></text>
</g>
<g class="term">
  <rect x="600" y="52" width="352" height="160" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="620" cy="72" r="5" fill="#ff5f57"/><circle cx="638" cy="72" r="5" fill="#febc2e"/><circle cx="656" cy="72" r="5" fill="#28c840"/>
  <text class="tl" style="animation-delay:0.4s" x="622" y="100"><tspan fill="#0891b2">$ </tspan>whoami</text><text class="tl" style="animation-delay:0.9500000000000001s" x="622" y="124"><tspan fill="#0891b2"></tspan>john-isaac-escal</text><text class="tl" style="animation-delay:1.5s" x="622" y="148"><tspan fill="#0891b2">$ </tspan>ls ~/projects</text><text class="tl" style="animation-delay:2.0500000000000003s" x="622" y="172"><tspan fill="#0891b2"></tspan>raster  bahalert  echo-path  flipface</text>
  <text class="tl" style="animation-delay:2.6s" x="622" y="196"><tspan fill="#0891b2">$ </tspan><tspan class="caret">▋</tspan></text>
</g>
</svg>
