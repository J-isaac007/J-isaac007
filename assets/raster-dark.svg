<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-labelledby="t d">
<title id="t">Raster</title>
<desc id="d">Free, offline pixel art editor for Windows. Layers, animation, RotSprite, sprite sheets. Built with TypeScript, React, Electron.</desc>
<defs>
