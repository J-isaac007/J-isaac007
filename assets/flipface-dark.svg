<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-labelledby="t d">
<title id="t">FlipFace</title>
<desc id="d">Fixes swapped face buttons by remapping any controller to a virtual Xbox 360 pad. Built with C#, SDL3, ViGEm.</desc>
<defs>
  <linearGradient id="ca" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <radialGradient id="cg1"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <radialGradient id="cg2"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <pattern id="cd" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#30363d"/></pattern>
</defs>
<style>
  .label { font: 600 11px "JetBrains Mono", "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; letter-spacing: .14em; fill: #8d96a0; }
  .title { font: 700 28px "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; letter-spacing: -.015em; fill: #e6edf3; }
  .desc { font: 400 15px "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; fill: #8d96a0; }
  .chip { font: 500 12px "JetBrains Mono", "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; fill: #e6edf3; }
  .pill { font: 700 11px "JetBrains Mono", "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; letter-spacing: .08em; fill: #d29922; }
  .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 411.6px 37px; }
  @keyframes pulse { 50% { opacity: .25; transform: scale(1.6); } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
</style>
<rect x=".5" y=".5" width="479" height="219" rx="16" fill="#161b22" stroke="#30363d"/>
<circle cx="470" cy="10" r="170" fill="url(#cg1)"/>
<rect x="28" y="0" width="56" height="3" rx="1.5" fill="url(#ca)"/>
<text class="label" x="28" y="42">WINDOWS · .NET 10</text>
<rect x="397.6" y="25" width="54.4" height="24" rx="12" fill="#d29922" fill-opacity=".12" stroke="#d29922" stroke-opacity=".4"/>
<circle class="pulse" cx="411.6" cy="37" r="3.5" fill="#d29922"/>
<text class="pill" x="421.6" y="41">WIP</text>
<text class="title" x="28" y="90">FlipFace <tspan fill="url(#ca)" font-size="22">↗</tspan></text>
<text class="desc" x="28" y="122">Fixes swapped face buttons by remapping any</text>
<text class="desc" x="28" y="144">controller to a virtual Xbox 360 pad.</text>
<rect x="28" y="168" width="36.8" height="26" rx="13" fill="#0d1117" stroke="#30363d"/><text class="chip" x="46.4" y="185.5" text-anchor="middle">C#</text><rect x="72.8" y="168" width="51.6" height="26" rx="13" fill="#0d1117" stroke="#30363d"/><text class="chip" x="98.6" y="185.5" text-anchor="middle">SDL3</text><rect x="132.4" y="168" width="59" height="26" rx="13" fill="#0d1117" stroke="#30363d"/><text class="chip" x="161.9" y="185.5" text-anchor="middle">ViGEm</text>
</svg>
